Transform: AWS::Serverless-2016-10-31
Parameters:
  PaymentSecretArn:
    Type: String
    Description: ARN of the payment gateway secret in AWS Secrets Manager
    Default: arn:aws:secretsmanager:us-east-1:123456789012:secret:prod/order-service/payment-gateway
Resources:
  OderApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub
        - ${ResourceName} From Stack ${AWS::StackName}
        - ResourceName: OderApi
      StageName: Prod
      DefinitionBody:
        openapi: '3.0'
        info: {}
        paths:
          /orders:
            post:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateOrder.Arn}/invocations
              responses: {}
      EndpointConfiguration: REGIONAL
      TracingEnabled: true
      Cors:
        MaxAge: 5
  CreateOrder:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: CreateOrder
      CodeUri: src/CreateOrder
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 128
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          ORDERSTABLE_TABLE_NAME: !Ref OrdersTable
          ORDERSTABLE_TABLE_ARN: !GetAtt OrdersTable.Arn
          ORDERQUEUE_QUEUE_NAME: !GetAtt OrderQueue.QueueName
          ORDERQUEUE_QUEUE_ARN: !GetAtt OrderQueue.Arn
          ORDERQUEUE_QUEUE_URL: !Ref OrderQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt OrderQueue.QueueName
      Events:
        OderApiPOSTorders:
          Type: Api
          Properties:
            Path: /orders
            Method: POST
            RestApiId: !Ref OderApi
  CreateOrderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateOrder}
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: expiration
        Enabled: true
  OrderQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: true
      MessageRetentionPeriod: 345600
  UpdateInventory:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: UpdateInventory
      CodeUri: src/UpdateInventory
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 128
      Timeout: 30
      Tracing: Active
      Environment: {}
  UpdateInventoryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${UpdateInventory}
  OrderNotifications:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
  ProcessPayment:
    Type: AWS::Serverless::Function
    Properties:
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: ProcessPayment
      MemorySize: 128
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          ORDERNOTIFICATIONS_QUEUE_NAME: !GetAtt OrderNotifications.QueueName
          ORDERNOTIFICATIONS_QUEUE_ARN: !GetAtt OrderNotifications.Arn
          ORDERNOTIFICATIONS_QUEUE_URL: !Ref OrderNotifications
          UPDATEINVENTORY_FUNCTION_NAME: !Ref UpdateInventory
          UPDATEINVENTORY_FUNCTION_ARN: !GetAtt UpdateInventory.Arn
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt OrderNotifications.QueueName
        - LambdaInvokePolicy:
            FunctionName: !Ref UpdateInventory
      Events:
        OrderQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderQueue.Arn
            BatchSize: 1

  ProcessPaymentLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 14
      LogGroupName: !Sub /aws/lambda/${ProcessPayment}